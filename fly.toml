app = "ai-digital-brain"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  FLASK_ENV = "production"
  DEBUG = "false"
  TELEGRAM_ENABLED = "true"
  TELEGRAM_API_BASE = "http://127.0.0.1:5000"
  LOG_LEVEL = "INFO"
  LOG_DIR = "logs"

[[mounts]]
  source = "ai_brain_data"
  destination = "/app/instance"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
